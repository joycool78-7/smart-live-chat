name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -q smart-live-chat-v14-fixed.zip
          ls -la
          find . -maxdepth 3 -name "gradlew" -type f

      - name: Build APK
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" -type f | head -n 1))
          echo "Found gradlew in $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
