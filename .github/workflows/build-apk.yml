name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -q smart-live-chat-v14-fixed.zip
          ls -la smart-live-chat

      - name: Build APK
        run: |
          cd smart-live-chat
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "smart-live-chat/app/build/outputs/apk/debug/app-debug.apk"
